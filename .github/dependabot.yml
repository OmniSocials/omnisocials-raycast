# Version updates for npm only; this repo has no GitHub Actions workflows. npm version updates
# create too many pull requests, so every update goes into one of two groups: minor and patch
# updates together, and major updates on their own. npm security fixes still come from
# Dependabot alerts. Every pull request goes to main and waits 7 days after a release (cooldown),
# the same rule as min-release-age on the Mac.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"
